name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install dependencies
        run: npm ci

      - name: Check synchronized SemVer
        run: npm run version:check

      - name: Check production desktop hardening
        run: npm run desktop:check-production

      - name: Run frontend and API tests
        run: npm test

      - name: Build web UI
        run: npm run build

      - name: Build desktop UI
        run: npm run build:desktop-ui

      - name: Check Rust desktop layer
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Rust desktop layer
        run: cargo test --manifest-path src-tauri/Cargo.toml
