name: Nightly

on:
  # schedule:
  #   - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  build:
    name: Build nightly artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install dependencies
        run: npm ci

      - name: Check synchronized SemVer
        run: npm run version:check

      - name: Check production desktop hardening
        run: npm run desktop:check-production

      - name: Run tests
        run: npm test

      - name: Build desktop bundle
        if: runner.os != 'Windows'
        run: npm run desktop:build

      - name: Build Windows desktop bundle
        if: runner.os == 'Windows'
        run: npm run desktop:build:windows

      - name: Generate checksums
        run: npm run release:checksums -- "src-tauri/target/release/bundle" "dist/checksums/SHA256SUMS-${{ runner.os }}-nightly.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.rpm
            dist/checksums/*.txt

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: worktree-manager-nightly-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.sig
            dist/checksums/*.txt

  publish:
    name: Publish nightly prerelease
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/nightly
          merge-multiple: true

      - name: Move nightly tag
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force

      - name: Replace nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes || true
          gh release create nightly dist/nightly/**/* \
            --title "Worktree Manager Nightly" \
            --notes "Nightly build from ${GITHUB_SHA}. This channel is unstable and may contain unfinished changes." \
            --prerelease
